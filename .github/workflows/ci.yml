name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install MoltenVK and the Vulkan headers
        run: brew install molten-vk vulkan-headers
      - name: Show tools
        run: swift --version
      - name: Unit tests
        run: swift test
