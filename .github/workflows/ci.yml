name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install MoltenVK
        run: brew install molten-vk
      - name: Show tools
        run: swift --version
      - name: Unit tests
        run: swift test
